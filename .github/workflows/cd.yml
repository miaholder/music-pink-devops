name: CD - Deploy to Cloudflare

on:
  push:
    branches: ["main"]

jobs:
  deploy-backend-worker:
    name: Deploy Backend (Cloudflare Worker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/api
        run: npm ci

      - name: Deploy Worker with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy

      - name: Smoke test API contract (health + search)
        run: |
          curl -fsS "https://api.music-pink-api.workers.dev/api/health"
          curl -fsS "https://api.music-pink-api.workers.dev/api/search?q=test" | grep -q '"results"'

  deploy-frontend-pages:
    name: Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: deploy-backend-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy static site to Pages (Wrangler)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web --project-name ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}

